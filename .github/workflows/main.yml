name: CI Workflow

# 設定觸發事件
on:
  push:
    branches:
      - main  # 當 push 到 main 分支時觸發
  pull_request:
    branches:
      - main  # 當有 PR 要合併到 main 分支時觸發

# 定義工作（job），這裡有一個名為 "build" 的工作
jobs:
  build:
    runs-on: ubuntu-latest  # 設定運行環境（Ubuntu）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 檢出源代碼，讓 GitHub Actions 能夠訪問它

      - name: Set up Python
        uses: actions/setup-python@v4  # 設置 Python 環境
        with:
          python-version: "3.x"  # 使用 Python 3.x 版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # 安裝依賴

      - name: Run tests
        run: |
          python -m unittest discover  # 執行單元測試

